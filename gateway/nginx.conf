events {}

http {
    upstream warden_service {
        server app:8080;
    }

    upstream report_service {
        server report-service:8081;
    }

    server {
        listen 80;

        location /api/wardens {
            proxy_pass http://warden_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/reports {
            proxy_pass http://report_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}