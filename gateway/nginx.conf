events {}

http {
    log_format traced '$remote_addr - [$time_local] "$request" $status '
                      'trace_id=$trace_id';
    access_log /var/log/nginx/access.log traced;

    map $http_x_trace_id $trace_id {
        default $http_x_trace_id;
        "" $request_id;
    }

    upstream warden_service {
        server app:8080;
    }

    server {
        listen 80;

        location /api/wardens {
            proxy_pass http://warden_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Trace-Id $trace_id;
        }

    }
}