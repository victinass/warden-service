databaseChangeLog:
  - changeSet:
      id: 001
      author: student
      changes:
        - createTable:
            tableName: wardens
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: full_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: birth_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: position
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: hire_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: fire_date
                  type: DATE

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false