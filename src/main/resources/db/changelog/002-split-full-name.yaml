databaseChangeLog:
  - changeSet:
      id: 002
      author: student
      changes:
        - addColumn:
            tableName: wardens
            columns:
              - column:
                  name: last_name
                  type: VARCHAR(255)
              - column:
                  name: first_name
                  type: VARCHAR(255)
              - column:
                  name: patronymic
                  type: VARCHAR(255)

        - sql:
            sql: >-
              UPDATE wardens
              SET last_name = split_part(trim(full_name), ' ', 1),
                  first_name = COALESCE(NULLIF(split_part(trim(full_name), ' ', 2), ''), split_part(trim(full_name), ' ', 1)),
                  patronymic = NULLIF(split_part(trim(full_name), ' ', 3), '')

        - addNotNullConstraint:
            tableName: wardens
            columnName: last_name
            columnDataType: VARCHAR(255)
        - addNotNullConstraint:
            tableName: wardens
            columnName: first_name
            columnDataType: VARCHAR(255)
        - dropColumn:
            tableName: wardens
            columnName: full_name
      rollback:
        - addColumn:
            tableName: wardens
            columns:
              - column:
                  name: full_name
                  type: VARCHAR(255)
        - sql:
            sql: >-
              UPDATE wardens
              SET full_name = trim(concat_ws(' ', last_name, first_name, patronymic))
        - dropColumn:
            tableName: wardens
            columnName: last_name
        - dropColumn:
            tableName: wardens
            columnName: first_name
        - dropColumn:
            tableName: wardens
            columnName: patronymic