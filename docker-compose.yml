services:
  postgres:
    image: postgres:17
    container_name: warden-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: warden-service:latest
    container_name: warden-service
    depends_on:
      - postgres
      - report-service
      - file-storage-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      REPORT_SERVICE_URL: http://report-service:8081
      FILE_STORAGE_URL: http://file-storage-service:8082

  report-service:
    build:
      context: .
      dockerfile: report-service/Dockerfile
    image: report-service:latest
    container_name: report-service
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      FILE_STORAGE_URL: http://file-storage-service:8082

  file-storage-service:
    build:
      context: .
      dockerfile: file-storage-service/Dockerfile
    image: file-storage-service:latest
    container_name: file-storage-service
    environment:
      FILE_STORAGE_PATH: /app/data/files
    volumes:
      - file_storage_data:/app/data/files

  gateway:
    image: nginx:1.27-alpine
    container_name: warden-gateway
    depends_on:
      - app
    ports:
      - "8088:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
  file_storage_data: