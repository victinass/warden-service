services:
  postgres:
    image: postgres:17
    container_name: warden-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: warden-service:latest
    container_name: warden-service
    depends_on:
      - postgres
      - report-service
      - rabbitmq
      - logstash
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      REPORT_SERVICE_URL: http://report-service:8081
      RABBITMQ_HOST: rabbitmq
      LOGSTASH_HOST: logstash

  report-service:
    build:
      context: .
      dockerfile: report-service/Dockerfile
    image: report-service:latest
    container_name: report-service
    depends_on:
      - postgres
      - logstash
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      FILE_STORAGE_URL: http://file-storage-service:8082
      LOGSTASH_HOST: logstash

  file-storage-service:
    build:
      context: .
      dockerfile: file-storage-service/Dockerfile
    image: file-storage-service:latest
    container_name: file-storage-service
    environment:
      FILE_STORAGE_PATH: /app/data/files
      RABBITMQ_HOST: rabbitmq
      LOGSTASH_HOST: logstash
    volumes:
      - file_storage_data:/app/data/files
    depends_on:
      - rabbitmq
      - logstash

  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: warden-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: warden-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: warden-logstash
    depends_on:
      - elasticsearch
    ports:
      - "5000:5000"
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: warden-kibana
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"

  gateway:
    image: nginx:1.27-alpine
    container_name: warden-gateway
    depends_on:
      - app
    ports:
      - "8088:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
  file_storage_data:
  elasticsearch_data: